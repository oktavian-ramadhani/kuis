let questions = [], currentQ = 0, score = 0, answered = false;

const defaultConfig = {
  quiz_title: "Quiz Akhlak Digital",
  welcome_message: "Uji pemahamanmu tentang akhlak mulia di era digital! 🚀",
  background_color: "#0f172a",
  surface_color: "#1e293b",
  text_color: "#f8fafc",
  primary_color: "#10b981",
  secondary_color: "#64748b",
  font_family: "Plus Jakarta Sans",
  font_size: 16
};

function shuffle(arr) { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

function startQuiz() {
  questions = shuffle([...allQuestions]).slice(0, 20);
  questions.forEach(q => q.options = shuffle([...q.options]));
  currentQ = 0; score = 0; answered = false;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQuestion();
}

function showStart() {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
}

function renderQuestion() {
  answered = false;
  const q = questions[currentQ];
  document.getElementById('q-counter').textContent = `Soal ${currentQ+1}/${questions.length}`;
  document.getElementById('score-num').textContent = score;
  document.getElementById('progress-bar').style.width = `${((currentQ)/questions.length)*100}%`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('next-btn').classList.add('hidden');
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn w-full text-left p-4 rounded-xl border border-slate-600 bg-slate-700/50 text-slate-200 font-500 text-sm md:text-base';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, q.a);
    container.appendChild(btn);
  });
}

function selectAnswer(btn, selected, correct) {
  if(answered) return;
  answered = true;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => {
    if(b.textContent === correct) b.classList.add('correct');
    if(b === btn && selected !== correct) b.classList.add('wrong');
  });
  if(selected === correct) score++;
  document.getElementById('score-num').textContent = score;
  document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
  currentQ++;
  if(currentQ >= questions.length) { showResult(); return; }
  document.getElementById('quiz-screen').querySelector('.max-w-2xl').classList.remove('animate-slide-up');
  void document.getElementById('quiz-screen').querySelector('.max-w-2xl').offsetWidth;
  document.getElementById('quiz-screen').querySelector('.max-w-2xl').classList.add('animate-slide-up');
  renderQuestion();
}

function showResult() {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  const pct = Math.round((score/questions.length)*100);
  document.getElementById('result-score').textContent = `${score}/${questions.length}`;
  const icon = document.getElementById('result-icon');
  if(pct >= 80) { icon.innerHTML='<span style="font-size:56px">🏆</span>'; icon.style.background='rgba(16,185,129,0.2)'; document.getElementById('result-title').textContent='Masya Allah!'; document.getElementById('result-msg').textContent='Kamu memahami akhlak digital dengan sangat baik!'; }
  else if(pct >= 60) { icon.innerHTML='<span style="font-size:56px">⭐</span>'; icon.style.background='rgba(251,191,36,0.2)'; document.getElementById('result-title').textContent='Bagus!'; document.getElementById('result-msg').textContent='Terus pelajari dan terapkan akhlak mulia di era digital.'; }
  else { icon.innerHTML='<span style="font-size:56px">📖</span>'; icon.style.background='rgba(99,102,241,0.2)'; document.getElementById('result-title').textContent='Semangat Belajar!'; document.getElementById('result-msg').textContent='Yuk pelajari kembali materi akhlak digital agar lebih paham.'; }
  document.getElementById('progress-bar').style.width='100%';
}

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const font = config.font_family || defaultConfig.font_family;
    const size = config.font_size || defaultConfig.font_size;
    document.body.style.fontFamily = `${font}, sans-serif`;
    document.getElementById('title-el').textContent = config.quiz_title || defaultConfig.quiz_title;
    document.getElementById('welcome-el').textContent = config.welcome_message || defaultConfig.welcome_message;
    document.getElementById('title-el').style.fontSize = `${size * 2.2}px`;
    document.getElementById('welcome-el').style.fontSize = `${size * 1.1}px`;
    const app = document.getElementById('app');
    app.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color} 0%, ${config.surface_color || defaultConfig.surface_color} 50%, ${config.background_color || defaultConfig.background_color} 100%)`;
    document.querySelectorAll('.option-btn').forEach(b => { if(!b.classList.contains('correct')&&!b.classList.contains('wrong')) b.style.borderColor = config.secondary_color || defaultConfig.secondary_color; });
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get:()=>config.background_color||defaultConfig.background_color, set:(v)=>{config.background_color=v;window.elementSdk.setConfig({background_color:v})} },
      { get:()=>config.surface_color||defaultConfig.surface_color, set:(v)=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})} },
      { get:()=>config.text_color||defaultConfig.text_color, set:(v)=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})} },
      { get:()=>config.primary_color||defaultConfig.primary_color, set:(v)=>{config.primary_color=v;window.elementSdk.setConfig({primary_color:v})} },
      { get:()=>config.secondary_color||defaultConfig.secondary_color, set:(v)=>{config.secondary_color=v;window.elementSdk.setConfig({secondary_color:v})} }
    ],
    borderables: [],
    fontEditable: { get:()=>config.font_family||defaultConfig.font_family, set:(v)=>{config.font_family=v;window.elementSdk.setConfig({font_family:v})} },
    fontSizeable: { get:()=>config.font_size||defaultConfig.font_size, set:(v)=>{config.font_size=v;window.elementSdk.setConfig({font_size:v})} }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
    ["welcome_message", config.welcome_message || defaultConfig.welcome_message]
  ])
});
